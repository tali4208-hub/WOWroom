<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台中租屋物件總覽</title>
<meta name="description" content="台中套房、整層、店面出租物件，依區域、租金、關鍵字快速搜尋。">
<style>
:root{--or:#f97316;--or2:#ea580c;--bg:#faf9f7;--card:#fff;--line:#e7e5e4;--tx:#1c1917;--mut:#78716c;--soft:#fff7ed;--softb:#fed7aa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:10;background:#1c1917;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:140px}
.stat{font-size:12px;color:#d6d3d1}
.btn{border:0;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-line{background:#06c755;color:#fff}
.btn-ghost{background:#fff;color:var(--tx);border:1px solid var(--line)}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:16px}
aside{align-self:start;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;padding-right:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box.rent{background:var(--soft);border-color:var(--softb)}
.box h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.box h3 a{font-weight:400;font-size:13px;color:var(--mut);cursor:pointer;text-decoration:underline}
input[type=search],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.row2{display:flex;gap:8px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;user-select:none;color:var(--tx)}
.chip small{color:var(--mut);margin-left:3px}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.chip.on small{color:#ffedd5}
.chip.zero{opacity:.4;cursor:default}
.grp{margin:10px 0 6px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.grp b{background:#1c1917;color:#fff;border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.topbar .cnt{font-weight:700}
select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.ph{aspect-ratio:3/2;background:#e7e5e4 center/cover no-repeat}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px}
.ti{font-weight:700;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad{font-size:13px;color:var(--or2)}
.meta{font-size:12px;color:var(--mut)}
.pr{font-size:20px;font-weight:800}
.pr small{font-size:13px;font-weight:400;color:var(--mut)}
.msg{padding:40px 10px;text-align:center;color:var(--mut)}
.filterBtn{display:none}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;padding:12px 16px}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .filterBtn{display:inline-flex}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .ti{font-size:14px}.pr{font-size:17px}
}
@media (max-width:340px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>台中租屋物件總覽</h1>
  <span class="stat" id="stat">讀取中…</span>
  <a class="btn btn-line" id="lineBtn" target="_blank" rel="noopener">LINE 詢問</a>
</header>

<div class="wrap">
  <aside id="side">
    <div class="box">
      <input type="search" id="q" placeholder="搜尋 地址 / 標題（例：陽台獨洗、可寵）">
    </div>
    <div class="box rent">
      <h3>租金篩選 <a id="clrRent">清除</a></h3>
      <div class="row2">
        <input type="number" id="minR" placeholder="最低租金" inputmode="numeric">
        <input type="number" id="maxR" placeholder="最高租金" inputmode="numeric">
      </div>
      <div class="chips" id="rentChips"></div>
    </div>
    <div class="box">
      <h3><span>區域篩選 <span id="areaN"></span></span><a id="clrArea">清除</a></h3>
      <div id="areas"></div>
      <div class="hint">點區名可複選；點黑色標籤可整區一次選。</div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <span class="cnt" id="cnt"></span>
      <span style="display:flex;gap:8px">
        <button class="btn btn-ghost filterBtn" id="fBtn">篩選</button>
        <select id="sort">
          <option value="new">最新刊登</option>
          <option value="low">租金低→高</option>
          <option value="high">租金高→低</option>
        </select>
      </span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="msg" id="msg">物件讀取中…</div>
  </main>
</div>

<script>
/* ===== 設定（只要改這裡）===== */
const LANDLORD_ID = 'ualjjinlhrglzm69';            // 租租通「WOW台中租屋小幫手」
const LINE_URL    = 'https://line.me/ti/p/4Kk6A8hKbV';
const VERSION     = 'v1.0.0';
/* ============================ */

const API = p => `https://api.dd-room.com/api/v1/landlord/objects/${LANDLORD_ID}?category=&page=${p}&per_page=20&order=sort_at&sort=desc`;
const GROUPS = [
  ['市區',['中區','東區','西區','南區','北區','西屯區','南屯區','北屯區']],
  ['屯區',['大里區','太平區','霧峰區','烏日區']],
  ['山線',['豐原區','后里區','石岡區','東勢區','和平區','新社區','潭子區','大雅區','神岡區']],
  ['海線',['沙鹿區','梧棲區','清水區','大甲區','外埔區','大安區','龍井區','大肚區']],
];
const RENTS = [['6千以下',0,6000],['6千-8千',6000,8000],['8千-1萬',8000,10000],['1萬-1.5萬',10000,15000],['1.5萬-2萬',15000,20000],['2萬以上',20000,1e9]];

let ALL = [], selAreas = new Set(), rentPreset = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const areaKey = o => o.address?.city === '臺中市' ? o.address.area : '其他';

$('lineBtn').href = LINE_URL;

async function getPage(p){
  for (let t = 0; t < 3; t++){
    try { const r = await fetch(API(p)); if (r.ok) return (await r.json()).data; } catch(e){}
    await new Promise(r => setTimeout(r, 800));
  }
  throw new Error('page ' + p);
}

async function load(){
  try{
    const first = await getPage(1);
    const rest = [];
    for (let p = 2; p <= first.last_page; p++) rest.push(getPage(p));
    const pages = [first, ...(await Promise.all(rest))];
    const seen = new Set();
    pages.forEach((pg, i) => pg.items.forEach((o, j) => {
      if (seen.has(o.object_id)) return; seen.add(o.object_id);
      o._ord = i * 100 + j;
      o._text = (o.title + ' ' + (o.address?.complete || '') + ' ' + (o.type_space_name || '') + ' ' + (o.category_name || '')).toLowerCase();
      ALL.push(o);
    }));
    const now = new Date();
    $('stat').textContent = `共 ${ALL.length} 間｜資料更新：${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}（即時）`;
    buildAreas(); render();
  }catch(e){
    $('msg').innerHTML = '物件暫時讀取失敗，請稍後重新整理，或直接 <a href="'+LINE_URL+'" target="_blank">加 LINE 詢問</a>。';
    $('stat').textContent = '讀取失敗';
  }
}

function buildRent(){
  $('rentChips').innerHTML = RENTS.map((r,i)=>`<span class="chip${rentPreset===i?' on':''}" data-i="${i}">${r[0]}</span>`).join('');
}
$('rentChips').onclick = e => {
  const c = e.target.closest('.chip'); if(!c) return;
  const i = +c.dataset.i; rentPreset = rentPreset === i ? -1 : i;
  $('minR').value = ''; $('maxR').value = ''; buildRent(); render();
};
['minR','maxR'].forEach(id => $(id).oninput = () => { rentPreset = -1; buildRent(); render(); });
$('clrRent').onclick = () => { rentPreset = -1; $('minR').value=''; $('maxR').value=''; buildRent(); render(); };

function buildAreas(){
  const cnt = {}; ALL.forEach(o => { const k = areaKey(o); cnt[k] = (cnt[k]||0) + 1; });
  const groups = cnt['其他'] ? [...GROUPS, ['其他',['其他']]] : GROUPS;
  $('areaN').textContent = `- ${Object.keys(cnt).length}區有物件`;
  $('areas').innerHTML = groups.map(([g, list]) =>
    `<div class="grp"><b data-g="${g}">${g}</b>${list.reduce((s,a)=>s+(cnt[a]||0),0)}間</div><div class="chips">` +
    list.map(a => `<span class="chip${selAreas.has(a)?' on':''}${cnt[a]?'':' zero'}" data-a="${a}">${a==='其他'?'外縣市':a}<small>${cnt[a]||0}</small></span>`).join('') +
    `</div>`).join('');
}
$('areas').onclick = e => {
  const g = e.target.closest('[data-g]');
  if (g){
    const list = (GROUPS.find(x=>x[0]===g.dataset.g)||[,['其他']])[1].filter(a => ALL.some(o=>areaKey(o)===a));
    const allOn = list.every(a => selAreas.has(a));
    list.forEach(a => allOn ? selAreas.delete(a) : selAreas.add(a));
  } else {
    const c = e.target.closest('.chip'); if(!c || c.classList.contains('zero')) return;
    const a = c.dataset.a; selAreas.has(a) ? selAreas.delete(a) : selAreas.add(a);
  }
  buildAreas(); render();
};
$('clrArea').onclick = () => { selAreas.clear(); buildAreas(); render(); };

$('q').oninput = render;
$('sort').onchange = render;
$('fBtn').onclick = () => $('side').classList.toggle('open');

function render(){
  if (!ALL.length) return;
  const words = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let lo = 0, hi = 1e9;
  if (rentPreset >= 0){ lo = RENTS[rentPreset][1]; hi = RENTS[rentPreset][2]; }
  else { if ($('minR').value) lo = +$('minR').value; if ($('maxR').value) hi = +$('maxR').value; }
  let list = ALL.filter(o =>
    words.every(w => o._text.includes(w)) &&
    o.rent >= lo && (rentPreset >= 0 ? o.rent < hi || hi === 1e9 : o.rent <= hi) &&
    (!selAreas.size || selAreas.has(areaKey(o))));
  const s = $('sort').value;
  list.sort((a,b) => s==='low' ? a.rent-b.rent : s==='high' ? b.rent-a.rent : a._ord-b._ord);
  $('cnt').textContent = `符合 ${list.length} 間`;
  $('msg').textContent = list.length ? '' : '沒有符合的物件，試試放寬條件。';
  $('grid').innerHTML = list.map(o => {
    const img = o.covers?.[0]?.image?.sm || '';
    const meta = [o.type_space_name || o.category_name, o.ping ? o.ping + '坪' : '', o.floor ? o.floor + '樓' : ''].filter(Boolean).join('・');
    return `<a class="card" href="https://www.dd-room.com/object/${esc(o.object_id)}" target="_blank" rel="noopener">
      <div class="ph" style="background-image:url('${esc(img)}')" role="img" aria-label="${esc(o.title)}"></div>
      <div class="cb">
        <div class="ti">${esc(o.title)}</div>
        <div class="ad">📍 ${esc(o.address?.complete || '')}</div>
        <div class="meta">${esc(meta)}</div>
        <div class="pr">$${Number(o.rent).toLocaleString()}<small> /月</small></div>
      </div></a>`;
  }).join('');
}

buildRent(); load();
</script>
</body>
</html>
