<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOW 台中租屋</title>
<meta name="description" content="台中套房、整層住家、店面出租物件，依區域、租金、特色快速搜尋。">
<style>
:root{--br:#5b4636;--br2:#7a5f49;--cr:#f5efe6;--cr2:#ece3d6;--card:#fffdf9;--tx:#2b231c;--mut:#8a7a6b;--ac:#2f7d6d;--line:#e2d7c8}
*{box-sizing:border-box}
body{margin:0;background:var(--cr);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;font-size:15px}
a{color:inherit}
.hero{background:var(--br);color:#fff;padding:22px 16px 26px}
.hero-in{max-width:1080px;margin:0 auto}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand h1{margin:0;font-size:22px;letter-spacing:1px}
.brand h1 span{font-weight:400;opacity:.8;font-size:15px;margin-left:6px}
.line{background:#06c755;color:#fff;text-decoration:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.sbox{margin-top:16px;display:flex;background:#fff;border-radius:10px;overflow:hidden}
.sbox input{flex:1;border:0;padding:14px;font-size:16px;outline:none;min-width:0;color:var(--tx)}
.sub{margin-top:10px;font-size:12px;opacity:.75}

.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--tx);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ac);color:#fff;font-weight:700}
.dd{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--tx);display:inline-flex;gap:6px;align-items:center}
.dd.act{border-color:var(--ac);color:var(--ac);font-weight:700}
button.dd::after{content:"▾";font-size:11px;opacity:.6}
.sp{flex:1}
.clr{border:0;background:none;color:var(--ac);font-size:14px;cursor:pointer;padding:8px 4px;text-decoration:underline}
.panel{display:none;max-width:1080px;margin:0 auto;padding:4px 16px 16px;max-height:70vh;overflow:auto}
.panel.open{display:block}
.pg{margin-top:12px}
.pg-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--br);margin-bottom:6px}
.pg-h button{border:0;background:none;color:var(--ac);font-size:12px;cursor:pointer;padding:0}
.ck{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px 10px}
.ck label{display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 0;cursor:pointer}
.ck label.no{opacity:.35;cursor:default}
.ck em{font-style:normal;color:var(--mut);font-size:12px}
.ck input{accent-color:var(--ac);width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;user-select:none}
.chip em{font-style:normal;color:var(--mut);font-size:12px;margin-left:3px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip.on em{color:#d7efe9}
.phint{font-size:12px;color:var(--mut);margin-top:10px}
.rl{display:flex;flex-direction:column;gap:2px;max-width:360px}
.rl label{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;cursor:pointer}
.rl input{accent-color:var(--ac)}
.rc{display:flex;gap:8px;align-items:center;margin-top:8px;max-width:360px}
.rc input{flex:1;min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.pf{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.pbtn{border:0;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;background:var(--ac);color:#fff;font-weight:700}
.pbtn.gh{background:var(--cr2);color:var(--tx);font-weight:400}

.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 90px}
.stats{display:flex;gap:10px;margin-bottom:12px}
.st{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.st small{display:block;font-size:12px;color:var(--mut)}
.st b{font-size:20px;color:var(--br)}
.cnt{font-size:16px;color:var(--br);margin-right:6px}
.rowi{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.rowi .info{margin-bottom:0}
.info{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;font-size:14px}
.tag{background:var(--cr2);border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer}
.tag::after{content:" ✕";opacity:.5}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;min-height:130px}
.item:hover{border-color:var(--br2)}
.ph{width:42%;max-width:200px;flex-shrink:0;background:var(--cr2) center/cover no-repeat;position:relative}
.fav{position:absolute;top:6px;left:6px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:18px;color:#b4a99c;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.fav.on{color:#e11d48}
.favBtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.favBtn.on{background:#fff;color:#e11d48}
.brand .acts{display:flex;gap:8px}
.ib{padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ar{font-size:12px;color:var(--ac);font-weight:700}
.ti{font-size:15px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{margin-top:auto;font-size:18px;font-weight:800;color:var(--br)}
.pr small{font-size:12px;font-weight:400;color:var(--mut)}
.msg{padding:40px 10px;text-align:center;color:var(--mut)}
.pager{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin:22px 0 4px}
.pager button{min-width:40px;height:40px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:15px;cursor:pointer;color:var(--tx)}
.pager button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}
.pager .dots{color:var(--mut);padding:0 2px}
.pinfo{text-align:center;font-size:13px;color:var(--mut)}
.toTop{position:fixed;right:16px;bottom:20px;z-index:50;width:52px;height:52px;border-radius:50%;border:0;background:var(--br);color:#fff;font-size:13px;font-weight:700;line-height:1.1;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.toTop:active{transform:scale(.95)}
@media (max-width:760px){
  .list{grid-template-columns:1fr}
  .brand h1 span{display:none}
  .ph{width:38%}
  .seg{width:100%}
  .seg button{flex:1;padding:8px 4px}
  .bar-in{gap:6px}
  .dd{padding:8px 9px}
  .sp{display:none}
  #sort{max-width:118px;padding:7px 6px;flex-shrink:0}
}
</style>
</head>
<body>
<section class="hero"><div class="hero-in">
  <div class="brand">
    <h1>WOW 台中租屋<span>代租代管物件總覽</span></h1>
    <span class="acts"><button class="favBtn" id="favBtn">♥ 收藏 <span id="favN">0</span></button><a class="line" id="lineBtn" target="_blank" rel="noopener">LINE 詢問</a></span>
  </div>
  <div class="sbox"><input type="search" id="q" placeholder="輸入路名、關鍵字，例如：進化路、一中"></div>
  <div class="sub" id="stat">物件讀取中…</div>
  <div class="sub" id="views"></div>
</div></section>

<div class="bar">
  <div class="bar-in">
    <div class="seg" id="types">
      <button data-t="" class="on">全部</button>
      <button data-t="studio">套房</button>
      <button data-t="home">整層住家</button>
      <button data-t="shop">店面</button>
      <button data-t="office">辦公</button>
    </div>
    <button class="dd" id="bArea" data-p="pArea">區域</button>
    <button class="dd" id="bRent" data-p="pRent">租金</button>
    <button class="dd" id="bKw" data-p="pKw">特色</button>
    <button class="clr" id="clrAll">清除</button>
  </div>
  <div class="panel" id="pArea">
    <div id="areas"></div>
    <div class="pf"><button class="pbtn gh" id="clrArea">清除</button><button class="pbtn" data-close>看結果</button></div>
  </div>
  <div class="panel" id="pRent">
    <div class="rl" id="rents"></div>
    <div class="rc"><input type="number" id="minR" placeholder="最低" inputmode="numeric"> ～ <input type="number" id="maxR" placeholder="最高" inputmode="numeric"></div>
    <div class="pf"><button class="pbtn gh" id="clrRent">清除</button><button class="pbtn" data-close>看結果</button></div>
  </div>
  <div class="panel" id="pKw">
    <div class="chips" id="kws"></div>
    <div class="phint" id="kwNote"></div>
    <div class="phint">可複選；選多個＝要同時符合。數字是目前條件下符合的間數。</div>
    <div class="pf"><button class="pbtn gh" id="clrKw">清除</button><button class="pbtn" data-close>看結果</button></div>
  </div>
</div>

<main class="wrap">
  <div class="rowi"><div class="info" id="info"></div><select class="dd" id="sort">
      <option value="new">推薦</option>
      <option value="low">租金 低→高</option>
      <option value="high">租金 高→低</option>
    </select></div>
  <div class="list" id="list"></div>
  <div class="msg" id="msg">物件讀取中…</div>
  <div class="pager" id="pager"></div>
  <div class="pinfo" id="pinfo"></div>
  <div style="text-align:center;font-size:12px;color:var(--mut);margin-top:24px">WOW 台中租屋 <span id="ver"></span></div>
</main>
<button class="toTop" id="toTop" aria-label="回到最上面">▲<br>TOP</button>

<script>
/* ===== 設定（只要改這裡）===== */
const LANDLORD_ID = 'ualjjinlhrglzm69';            // 租租通「WOW台中租屋小幫手」
const LINE_URL    = 'https://line.me/ti/p/4Kk6A8hKbV';
const VERSION     = 'v1.8.0';
const PAGE_SIZE   = 50;                              // 每頁幾間
/* 瀏覽人次：用免費計數服務 abacus（不用註冊），顯示＝起始值＋實際次數；同一個瀏覽器分頁只算一次 */
const COUNTER_START = 1500;
const COUNTER_URL   = 'https://abacus.jasoncameron.dev';
const COUNTER_KEY   = 'wowroom-tali4208/visits';
/* 特色按鈕：[按鈕文字, 標題裡出現哪些字就算符合, 顯示在哪些類型]
   類型：s＝套房、h＝整層住家（店面、辦公不顯示特色；「全部」＝套房＋住家的都列）
   ※ 只比對「標題」，不看內文 */
const KEYWORDS = [
  ['屋主優惠', /首月半價|免仲介/,       'sh'],   // 首月半價、免仲介費
  ['陽台獨洗', /陽台獨洗/,              's'],
  ['獨洗獨曬', /獨洗獨曬/,              's'],
  ['獨洗脫烘', /獨洗脫烘|獨立洗脫烘/,   's'],
  ['可養貓',   /可寵|可貓/,             'sh'],
  ['可養狗',   /可寵/,                  'sh'],
  ['租屋補助', /租屋補助|租補/,         'sh'],   // 含「雙租屋補助」
  ['電梯',     /電梯/,                  'sh'],
  ['子母車',   /子母車/,                'sh'],
  ['管理員',   /管理員|管理室/,         'sh'],
  ['飲水機',   /飲水機/,                's'],
  ['流理台',   /流理台|流理臺/,         's'],
  ['乾濕分離', /乾溼分離|乾濕分離/,     's'],
  ['機車位',   /機車位/,                'sh'],
  ['汽車位',   /(?<!機)車位/,           's'],
  ['平面車位', /平面車位|門前.{0,2}車位/, 'h'],   // 門前車位算平面
  ['機械車位', t => /(?<!機)車位/.test(t) && !/平面車位|門前.{0,2}車位/.test(t), 'h'],   // 沒寫類型的車位都算機械
  ['家具電全配', /家具電全配/,          'sh'],
  ['免爬高',   /免爬/,                  'h'],
  ['全新完工/整理', /全新/,             'sh'],
  ['台水台電', /台水台電/,              'sh'],
  ['可戶籍',   /戶籍/,                  'sh'],
  ['可報稅',   /報稅/,                  'sh'],
  ['浴缸',     /浴缸/,                  'sh'],
];
const KW_NOTE = '此為網站抓取，以實際為主，可直接加LINE詢問';
/* 租金快選：依類型不同（[文字, 最低, 最高]） */
const RENT_SETS = {
  '':     [['不限',0,1e9],['6,000 以下',0,5999],['6,000 – 7,999',6000,7999],['8,000 – 9,999',8000,9999],['10,000 – 14,999',10000,14999],['15,000 – 19,999',15000,19999],['20,000 以上',20000,1e9]],
  home:   [['不限',0,1e9],['20,000 以下',0,19999],['20,000 – 24,999',20000,24999],['25,000 – 29,999',25000,29999],['30,000 – 34,999',30000,34999],['35,000 – 39,999',35000,39999],['40,000 以上',40000,1e9]],
  biz:    [['不限',0,1e9],['20,000 以下',0,19999],['20,000 – 29,999',20000,29999],['30,000 – 49,999',30000,49999],['50,000 – 99,999',50000,99999],['100,000 以上',100000,1e9]],
};
RENT_SETS.studio = RENT_SETS[''];
RENT_SETS.shop = RENT_SETS.office = RENT_SETS.biz;
/* ============================ */

const API = p => `https://api.dd-room.com/api/v1/landlord/objects/${LANDLORD_ID}?category=&page=${p}&per_page=20&order=sort_at&sort=desc`;
const GROUPS = [
  ['市區',['中區','東區','西區','南區','北區','西屯區','南屯區','北屯區']],
  ['屯區',['大里區','太平區','霧峰區','烏日區']],
  ['山線',['豐原區','后里區','石岡區','東勢區','和平區','新社區','潭子區','大雅區','神岡區']],
  ['海線',['沙鹿區','梧棲區','清水區','大甲區','外埔區','大安區','龍井區','大肚區']],
];
let RENTS = RENT_SETS[''];
const kwTest = (k, t) => typeof k[1] === 'function' ? k[1](t) : k[1].test(t);
const isBiz = t => t === 'shop' || t === 'office';
const kwShown = i => isBiz(selType) ? false : selType === 'studio' ? KEYWORDS[i][2].includes('s') : selType === 'home' ? KEYWORDS[i][2].includes('h') : true;
const TYPES = {studio:'套房', home:'整層住家', shop:'店面', office:'辦公'};

let ALL = [], selAreas = new Set(), selKw = new Set(), rentPreset = 0, selType = '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString();
const typeOf = o => o.category === 'house' ? (o.type_space_name === '整層' ? 'home' : 'studio') : (o.category === 'office' ? 'office' : 'shop');

$('lineBtn').href = LINE_URL;

/* 收藏：存在客人自己的瀏覽器（換手機/清除瀏覽資料會不見） */
let favs = []; try { favs = JSON.parse(localStorage.getItem('wow_favs') || '[]'); } catch(e){}
let favMode = false;
function saveFavs(){ try { localStorage.setItem('wow_favs', JSON.stringify(favs)); } catch(e){} }
$('favBtn').onclick = () => { favMode = !favMode; document.querySelectorAll('.panel').forEach(x => x.classList.remove('open')); render(); window.scrollTo({top: $('list').offsetTop - 160, behavior:'smooth'}); };
$('list').addEventListener('click', e => {
  const h = e.target.closest('.fav'); if (!h) return;
  e.preventDefault(); e.stopPropagation();
  const id = h.dataset.id, i = favs.indexOf(id);
  i >= 0 ? favs.splice(i, 1) : favs.push(id); saveFavs(); draw();     // 收藏不換頁
});
$('ver').textContent = VERSION;
$('kwNote').textContent = '※ ' + KW_NOTE;

/* 下拉面板 */
document.querySelectorAll('.bar-in .dd[data-p]').forEach(b => b.onclick = () => {
  const p = $(b.dataset.p), open = p.classList.contains('open');
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('open'));
  if (!open) p.classList.add('open');
});
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('open'));
  window.scrollTo({top: $('list').offsetTop - 140, behavior: 'smooth'});
});

/* 讀資料：一次最多 4 頁同時抓，失敗會重試（租租通同時太多會擋） */
async function getPage(p){
  for (let t = 0; t < 5; t++){
    try { const r = await fetch(API(p)); if (r.ok) return (await r.json()).data; } catch(e){}
    await new Promise(r => setTimeout(r, 700 * (t + 1)));
  }
  throw new Error('page ' + p);
}
/* 精選：讀 featured.json（後台 admin.html 存的）。
   「推薦」排序：前 FEAT_TOP 間從精選裡依權重隨機抽，之後全部物件（含沒抽到的精選）隨機；不另外標示 */
let FEAT = new Map();      // id → 權重
let FEAT_TOP = 4;
/* 瀏覽人次（排除：開過後台 admin.html 的裝置、後台設定的 IP） */
async function countVisit(){
  try{
    let owner = false; try { owner = localStorage.getItem('wow_owner') === '1'; } catch(e){}
    let counted = false; try { counted = sessionStorage.getItem('wow_counted') === '1'; } catch(e){}
    if (!owner && !counted){
      let ips = [];
      try { const r = await fetch('settings.json?t=' + Date.now(), {cache:'no-store'}); if (r.ok) ips = (await r.json()).excludeIps || []; } catch(e){}
      if (ips.length){
        try { const r = await fetch('https://api.ipify.org?format=json'); if (r.ok && ips.includes((await r.json()).ip)) owner = true; } catch(e){}
      }
    }
    const act = (!owner && !counted) ? 'hit' : 'get';
    const r = await fetch(`${COUNTER_URL}/${act}/${COUNTER_KEY}`);
    if (!r.ok) return;
    const v = (await r.json()).value || 0;
    if (act === 'hit') { try { sessionStorage.setItem('wow_counted','1'); } catch(e){} }
    $('views').textContent = `累計瀏覽 ${(COUNTER_START + v).toLocaleString()} 人次`;
  }catch(e){}
}
countVisit();

async function loadFeatured(){
  try{
    const r = await fetch('featured.json?t=' + Date.now(), {cache:'no-store'});
    if (r.ok){
      const j = await r.json(), w = j.weights || {};
      (j.ids || []).forEach(id => FEAT.set(id, Math.max(1, +w[id] || 3)));
      if (Number.isFinite(+j.top)) FEAT_TOP = Math.max(0, +j.top);
    }
  }catch(e){}
}
async function load(){
  try{
    const featP = loadFeatured();
    const first = await getPage(1);
    const pages = [first];
    const todo = []; for (let p = 2; p <= first.last_page; p++) todo.push(p);
    const worker = async () => { while (todo.length){ const p = todo.shift(); pages[p-1] = await getPage(p); } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    const seen = new Set();
    pages.forEach((pg, i) => pg.items.forEach((o, j) => {
      if (seen.has(o.object_id)) return; seen.add(o.object_id);
      if (o.address?.city !== '臺中市') return;               // 外縣市不列入
      o._ord = Math.random();                                   // 每次打開網頁隨機排序
      o._text = (o.title + ' ' + (o.address?.complete || '') + ' ' + (o.type_space_name || '') + ' ' + (o.category_name || '')).toLowerCase();
      o._type = typeOf(o);
      o._kw = KEYWORDS.map(k => kwTest(k, o.title));
      ALL.push(o);
    }));
    await featP;
    // 精選抽籤：權重越高越容易排進前幾間（每次打開網頁抽一次，篩選時順序不跳動）
    ALL.forEach(o => { const w = FEAT.get(o.object_id); o._fk = w ? Math.pow(Math.random(), 1 / w) : -1; });
    const d = new Date();
    $('stat').textContent = `目前 ${ALL.length} 間刊登中｜資料更新 ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}（即時同步租租通）`;
    render();
  }catch(e){
    $('msg').innerHTML = '物件暫時讀取失敗，請稍後重新整理，或直接 <a href="'+LINE_URL+'" target="_blank">加 LINE 詢問</a>。';
    $('stat').textContent = '讀取失敗';
  }
}

/* 類型 */
$('types').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  selType = b.dataset.t;
  [...$('types').children].forEach(x => x.classList.toggle('on', x === b));
  // 換類型：租金快選換成該類型的級距；不適用的特色取消
  RENTS = RENT_SETS[selType]; rentPreset = 0; $('minR').value=''; $('maxR').value=''; buildRent();
  [...selKw].forEach(i => { if (!kwShown(i)) selKw.delete(i); });
  $('bKw').style.display = isBiz(selType) ? 'none' : '';
  if (isBiz(selType)) $('pKw').classList.remove('open');
  render();
};

/* 租金 */
function buildRent(){
  $('rents').innerHTML = RENTS.map((r,i)=>`<label><input type="radio" name="rent" value="${i}"${rentPreset===i?' checked':''}>${r[0]}</label>`).join('');
}
$('rents').onchange = e => { rentPreset = +e.target.value; $('minR').value=''; $('maxR').value=''; render(); };
['minR','maxR'].forEach(id => $(id).oninput = () => { rentPreset = -1; buildRent(); render(); });
$('clrRent').onclick = () => { rentPreset = 0; $('minR').value=''; $('maxR').value=''; buildRent(); render(); };
function rentRange(){
  if (rentPreset >= 0) return [RENTS[rentPreset][1], RENTS[rentPreset][2]];
  return [$('minR').value ? +$('minR').value : 0, $('maxR').value ? +$('maxR').value : 1e9];
}

/* 區域 */
function buildAreas(base){
  const cnt = {}; base.forEach(o => { const k = o.address.area; cnt[k] = (cnt[k]||0) + 1; });
  $('areas').innerHTML = GROUPS.map(([g, list]) =>
    `<div class="pg"><div class="pg-h">${g}<em style="font-weight:400;font-style:normal;color:var(--mut)">${list.reduce((s,a)=>s+(cnt[a]||0),0)}間</em><button data-g="${g}">全選</button></div><div class="ck">` +
    list.map(a => { const on = selAreas.has(a), n = cnt[a]||0;
      return `<label class="${n||on?'':'no'}"><input type="checkbox" value="${a}"${on?' checked':''}${n||on?'':' disabled'}>${a}<em>${n}</em></label>`; }).join('') +
    `</div></div>`).join('');
}
$('areas').onchange = e => { const a = e.target.value; e.target.checked ? selAreas.add(a) : selAreas.delete(a); render(); };
$('areas').onclick = e => {
  const g = e.target.closest('[data-g]'); if (!g) return;
  const list = GROUPS.find(x=>x[0]===g.dataset.g)[1].filter(a => ALL.some(o=>o.address.area===a));
  const allOn = list.every(a => selAreas.has(a));
  list.forEach(a => allOn ? selAreas.delete(a) : selAreas.add(a));
  render();
};
$('clrArea').onclick = () => { selAreas.clear(); render(); };

/* 特色 */
function buildKw(base){
  $('kws').innerHTML = KEYWORDS.map((k,i) => {
    if (!kwShown(i)) return '';
    const n = base.filter(o => o._kw[i]).length, on = selKw.has(i);
    if (!n && !on) return '';
    return `<span class="chip${on?' on':''}" data-k="${i}">${k[0]}<em>${n}</em></span>`;
  }).join('');
}
$('kws').onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const i = +c.dataset.k; selKw.has(i) ? selKw.delete(i) : selKw.add(i); render();
};
$('clrKw').onclick = () => { selKw.clear(); render(); };

$('clrAll').onclick = () => {
  selType = ''; [...$('types').children].forEach(x => x.classList.toggle('on', x.dataset.t === ''));
  RENTS = RENT_SETS['']; rentPreset = 0; $('minR').value=''; $('maxR').value=''; buildRent();
  selAreas.clear(); selKw.clear(); $('q').value = ''; favMode = false;
  $('bKw').style.display = '';
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('open'));
  render();
};
$('q').oninput = render;
$('sort').onchange = render;

/* 已選條件標籤（點一下移除） */
$('info').onclick = e => {
  const t = e.target.closest('.tag'); if (!t) return;
  if (t.dataset.a) selAreas.delete(t.dataset.a);
  if (t.dataset.k) selKw.delete(+t.dataset.k);
  if (t.dataset.r) { rentPreset = 0; $('minR').value=''; $('maxR').value=''; buildRent(); }
  if (t.dataset.q) $('q').value = '';
  if (t.dataset.fav) favMode = false;
  render();
};

/* 分頁：任何篩選、排序改變都回到第 1 頁 */
let PAGE = 1;
function render(){ PAGE = 1; draw(); }
function goPage(p){ PAGE = p; draw(); window.scrollTo({top: 0, behavior: 'smooth'}); }
$('toTop').onclick = () => window.scrollTo({top: 0, behavior: 'smooth'});
$('pager').onclick = e => { const b = e.target.closest('button[data-p]'); if (b && !b.disabled) goPage(+b.dataset.p); };

function draw(){
  if (!ALL.length) return;
  const q = $('q').value.trim();
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const [lo, hi] = rentRange();
  const okQ = o => words.every(w => o._text.includes(w));
  const okT = o => !selType || o._type === selType;
  const okR = o => o.rent >= lo && o.rent <= hi;
  const okA = o => !selAreas.size || selAreas.has(o.address.area);
  const okK = o => [...selKw].every(i => o._kw[i]);

  // 面板裡的數字＝「其他條件不變時」各選項有幾間
  buildAreas(ALL.filter(o => okQ(o) && okT(o) && okR(o) && okK(o)));
  buildKw(ALL.filter(o => okQ(o) && okT(o) && okR(o) && okA(o) && okK(o)));

  const live = new Set(ALL.map(o => o.object_id));
  const favLive = favs.filter(id => live.has(id));
  $('favN').textContent = favLive.length; $('favBtn').classList.toggle('on', favMode);
  let list = favMode ? ALL.filter(o => favs.includes(o.object_id))      // 收藏模式：只看收藏，不套其他條件
                    : ALL.filter(o => okQ(o) && okT(o) && okR(o) && okA(o) && okK(o));
  const s = $('sort').value;
  if (s === 'new'){
    // 推薦：每一頁的前 FEAT_TOP 間放精選（依權重抽出先後），精選放完為止；其餘位置全部隨機
    const F = FEAT_TOP > 0 ? list.filter(o => o._fk >= 0).sort((a,b) => b._fk - a._fk) : [];
    const fSet = new Set(F);
    const R = list.filter(o => !fSet.has(o)).sort((a,b) => a._ord - b._ord);
    const out = [];
    while (F.length || R.length){
      const page = F.splice(0, Math.min(FEAT_TOP, F.length));
      page.push(...R.splice(0, PAGE_SIZE - page.length));
      if (page.length < PAGE_SIZE && !R.length) page.push(...F.splice(0, PAGE_SIZE - page.length));
      out.push(...page);
    }
    list = out;
  } else {
    list.sort((a,b) => s==='low' ? a.rent-b.rent : b.rent-a.rent);   // 租金排序：單純照租金
  }


  const rentOn = rentPreset !== 0;
  const rentLbl = rentPreset > 0 ? RENTS[rentPreset][0] : `${lo?fmt(lo):'0'} – ${hi<1e9?fmt(hi):'不限'}`;
  $('bArea').classList.toggle('act', selAreas.size > 0);
  $('bArea').textContent = selAreas.size ? `區域(${selAreas.size})` : '區域';
  $('bRent').classList.toggle('act', rentOn);
  $('bRent').textContent = rentOn ? `租金 ${rentLbl}` : '租金';
  $('bKw').classList.toggle('act', selKw.size > 0);
  $('bKw').textContent = selKw.size ? `特色(${selKw.size})` : '特色';

  if (favMode){ $('info').innerHTML = `<b class="cnt">我的收藏 ${list.length} 間</b><span class="tag" data-fav="1">離開收藏</span>`;
    $('msg').textContent = list.length ? '' : '還沒有收藏，點物件照片左上角的 ♥ 就能收藏。'; }
  else
  $('info').innerHTML = `<b class="cnt">找到 ${list.length} 間</b>` +
    (q ? `<span class="tag" data-q="1">「${esc(q)}」</span>` : '') +
    [...selAreas].map(a => `<span class="tag" data-a="${a}">${a}</span>`).join('') +
    (rentOn ? `<span class="tag" data-r="1">${rentLbl}</span>` : '') +
    [...selKw].map(i => `<span class="tag" data-k="${i}">${KEYWORDS[i][0]}</span>`).join('');

  if (!favMode) $('msg').textContent = list.length ? '' : '沒有符合的物件，試試放寬條件，或加 LINE 告訴我們需求。';
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (PAGE > pages) PAGE = pages;
  const from = (PAGE - 1) * PAGE_SIZE, shown = list.slice(from, from + PAGE_SIZE);
  $('pinfo').textContent = list.length > PAGE_SIZE ? `第 ${PAGE} / ${pages} 頁（第 ${from + 1}–${from + shown.length} 間，共 ${list.length} 間）` : '';
  $('pager').innerHTML = pages > 1 ? pagerHtml(PAGE, pages) : '';
  $('list').innerHTML = shown.map(o => {
    const img = o.covers?.[0]?.image?.sm || '';
    const meta = [o.type_space_name || o.category_name, o.ping ? o.ping + '坪' : '', o.floor ? o.floor + 'F' : ''].filter(Boolean).join(' · ');
    return `<a class="item" href="https://www.dd-room.com/object/${esc(o.object_id)}" target="_blank" rel="noopener">
      <div class="ph" style="background-image:url('${esc(img)}')" role="img" aria-label="${esc(o.title)}"><span class="fav${favs.includes(o.object_id)?' on':''}" data-id="${esc(o.object_id)}" role="button" aria-label="收藏">♥</span></div>
      <div class="ib">
        <div class="ar">${esc(o.address.area)}・${TYPES[o._type]}</div>
        <div class="ti">${esc(o.title)}</div>
        <div class="mt">${esc(o.address?.complete || '')}</div>
        <div class="mt">${esc(meta)}</div>
        <div class="pr">$${fmt(o.rent)}<small> /月</small></div>
      </div></a>`;
  }).join('');
}

function pagerHtml(cur, n){
  const nums = [...new Set([1, cur - 2, cur - 1, cur, cur + 1, cur + 2, n])].filter(p => p >= 1 && p <= n).sort((a,b) => a - b);
  let h = `<button data-p="${cur - 1}"${cur === 1 ? ' disabled' : ''}>上一頁</button>`, prev = 0;
  nums.forEach(p => { if (p - prev > 1) h += '<span class="dots">…</span>'; h += `<button data-p="${p}"${p === cur ? ' class="on"' : ''}>${p}</button>`; prev = p; });
  return h + `<button data-p="${cur + 1}"${cur === n ? ' disabled' : ''}>下一頁</button>`;
}

buildRent(); load();
</script>
</body>
</html>
